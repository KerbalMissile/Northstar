@Kopernicus:FOR[Northstar]
{
    Body
    {
        name = Roco-A
        cacheFile = Northstar/Norda/Cache/Roco-A.bin
        Tag = Roco-A
        identifier = Northstar/Norda/Roco-A
        Template
        {
            name = Eeloo
            removeAllPQSMods = True
        }
        Properties
        {
            description = Roco-A is the only comet in the Norda system. It is a small, icy body that orbits Norda in a highly eccentric orbit. It used to be much bigger but due to the ice evaporating away as Norda got hotter, all that's left is a small remnant of it's former glory. Still an amazing sight to see but not as impressive as it once was.
            displayName = Roco-A
            radius = 10000
            geeASL = 0.01
			initialRotation = 130
			tidallyLocked = false
			isHomeWorld = false
            timewarpAltitudeLimits = 0 24500 24500 24500 40000 60000 80000 100000

			ScienceValues
			{
				landedDataValue = 9
				inSpaceLowDataValue = 13
				inSpaceHighDataValue = 4
				recoveryValue = 1.10003
				spaceAltitudeThreshold = 25000
			}
        }
        Orbit
        {
            referenceBody = Norda
            semiMajorAxis = 349213742095
            inclination = 0
            eccentricity = 0.4
            longitudeOfAscendingNode = 79.8
			argumentOfPeriapsis = 115
			meanAnomalyAtEpochD = 32
			epoch = 0
			color = 0.20, 0.20, 0.20, 1
            // iconTexture = Northstar/Norda/Textures/Logos/Comet.png
        }
        ScaledVersion
        {
            type = Vacuum
			fadeStart = 30000
			fadeEnd = 40000
            Material
            {
				color = 1,1,1,1
                specColor = 0,0,0,1
                shininess = 0
                texture = Northstar/Norda/Textures/Turna/TurnaTexture.dds
				normals = Northstar/Norda/Textures/Turna/TurnaNormal.dds
            }
        }
        PQS
        {
            fadeStart = 30000
            fadeEnd = 40000
            minLevel = 2
            maxLevel = 9
            materialType = AtmosphericTriplanarZoomRotation
            Material
            {
                saturation = 1
                contrast = 1
                tintColor = 1,1,1,1
                specularColor = 0.1,0.1,0.1,1
                albedoBrightness = 1
                steepPower = 1.5
                steepTexStart = 10000
                steepTexEnd = 200000
                steepTexScale = 1,1
                steepTexOffset = 0,0
                steepTex = BUILTIN/MunCliff [Diffuse]
                steepBumpMapScale = 1,1
                steepBumpMapOffset = 0,0
                steepBumpMap = BUILTIN/MunCliff [Normal]
                steepNearTiling = 500
                steepTiling = 350
                midTexScale = 1,1
                midTexOffset = 0,0
                midTex = BUILTIN/MunFloor [Diffuse]
                midBumpMapScale = 1,1
                midBumpMapOffset = 0,0
                midBumpMap = BUILTIN/MunFloor [Normal]
                midTiling = 150000
                midBumpTiling = 150000
                lowStart = -1
                lowEnd = -1
                highStart = 1
                highEnd = 1
                globalDensity = 1
            }
            Mods // you can add whatever you want (as long as it works lol)
            {
                VertexHeightMap
                {
                    map = Northstar/Norda/Textures/Turna/TurnaHeight.dds // height
                    offset = 0
                    deformity = 12000
                    scaleDeformityByRadius = false
                    order = 10
                    enabled = True
                }
                VertexColorMap
                {
                    map = Northstar/Norda/Textures/Turna/TurnaTexture.dds // color
                    order = 50
                    enabled = true
                }
                VertexHeightNoiseVertHeightCurve2 // there's a bunch of alien (to me) values here but this works quite well
                {
                    deformity = 1000
                    ridgedAddFrequency = 32
					ridgedAddLacunarity = 2
					ridgedAddOctaves = 8
					ridgedAddSeed = 937536357
					ridgedMode = Low
					ridgedSubFrequency = 32
					ridgedSubLacunarity = 2
					ridgedSubOctaves = 8
					ridgedSubSeed = 234352
					simplexFrequency = 24
					simplexHeightEnd = 6000
					simplexHeightStart = 0
					simplexOctaves = 8
					simplexPersistence = 0.5
					simplexSeed = 139783915
					order = 40
					enabled = True
                    simplexCurve
					{
						key = 0 0 0 0
						key = 0.6311918 0.4490898 1.432598 1.432598
						key = 1 1 0 0
					}
                }
                LandControl // feel free to copy paste this because i honestly can't bother explaining everything here
				{
					altitudeBlend = 0.01
					altitudeFrequency = 2
					altitudeOctaves = 2
					altitudePersistance = 0.5
					altitudeSeed = 53453
					createColors = True
					createScatter = True
					latitudeBlend = 0.05
					latitudeFrequency = 12
					latitudeOctaves = 6
					latitudePersistance = 0.5
					latitudeSeed = 53456345
					longitudeBlend = 0.05
					longitudeFrequency = 12
					longitudeOctaves = 4
					longitudePersistance = 0.5
					longitudeSeed = 98888
					useHeightMap = False
					vHeightMax = 6000
					order = 60
					enabled = True
					name = LCExample
					Scatters
					{
					}
					landClasses
					{
						Value
						{
							alterApparentHeight = 0
							alterRealHeight = 0
							color = 0,0,0,1
							coverageBlend = 1
							coverageFrequency = 1.5
							coverageOctaves = 4
							coveragePersistance = 0.5
							coverageSeed = 171214
							name = Main
							latDelta = 1
							latitudeDouble = False
							lonDelta = 1
							minimumRealHeight = 0
							noiseBlend = 0.5
							noiseColor = 0,0,0,1
							noiseFrequency = 8
							noiseOctaves = 4
							noisePersistance = 0.5
							noiseSeed = 453737
							delete = False
							altitudeRange
							{
								endEnd = 1
								endStart = 1
								startEnd = 0
								startStart = 0
							}
							// latitudeDoubleRange
							// {
							// 	endEnd = 0.4
							// 	endStart = 0.39
							// 	startEnd = 0.25
							// 	startStart = 0.23
							// }
							latitudeRange
							{
								endEnd = 1
								endStart = 0.75
								startEnd = 0.25
								startStart = 0
							}
							longitudeRange
							{
								endEnd = 2
								endStart = 2
								startEnd = -1
								startStart = -1
							}
							scatters
							{
							}
						}
					}
				}
            }
        }
    }
}

