        {
            description = A small, rocky planet orbiting Norda. Ferno originally had an atmosphere and clouds but as Norda evolved from a star to a supermassive blackhole the temperature around it got too hot and the atmosphere evaporated away. Due to the heat and sheer gravity of Norda, it formed massive cracks, rivers, and ravines, all of which lava flows into. Ferno isn't volcanically active but it does have lava flowing all over the surface. Part of a planet called Reta, a Kerbin-sized planet, can be found on and inside Ferno. Reta was eaten by Norda when it was a stellar-mass blackhole, leaving only a bit for Ferno to absorb.
            displayName = Ferno
            radius = 200000
            geeASL = 0.5
            initialRotation = 0
            tidallyLocked = True
            isHomeWorld = false
            timewarpAltitudeLimits = 0 24500 24500 24500 40000 60000 80000 100000 // Adapt

